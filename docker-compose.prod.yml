# Environnement de production : l'application et son orchestrateur Airflow (ADR-0011).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm train
#   docker compose -f docker-compose.prod.yml --env-file .env.prod restart api
#   Interface Airflow : http://127.0.0.1:8080 (compte admin, mot de passe AIRFLOW_ADMIN_PASSWORD)
#
# --build ne concerne que l'image d'Airflow (dossier airflow/) : l'application, elle,
# n'est jamais construite ici.
#
# Rien n'est construit ici : l'image est celle que la CD a publiée sur ghcr.io,
# dans la version APP_VERSION (voir CONTRIBUTING.md, « CI/CD »).
#
# La base est le MongoDB de l'ERP (ADR-0010). C'est un service externe, sur une
# autre machine : ce compose ne le lance pas et ne partage aucun réseau Docker avec
# lui. `train` s'y connecte par son adresse, donnée par TRAINING_SOURCE_URL, comme à
# n'importe quel service distant. L'API ne s'y connecte jamais.
#
# Faute de serveur, l'ERP est simulé hors de ce dépôt (dossier erp_prod_test, à côté
# du projet) et publie MongoDB sur le port 27017 de sa machine. Sur le même poste,
# cette machine est `host.docker.internal` ; sur un autre poste, son adresse IP ou
# son nom DNS.
#
# Modèle des variables : .env.prod.example.

name: livraison-express-prod

# Durcissement appliqué à tous les services : système de fichiers en lecture seule
# (seuls le volume et /tmp sont modifiables), aucune capacité Linux, aucune
# élévation de privilèges possible (sudo, setuid).
x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

# Réglages communs aux services qui exécutent l'application.
x-app: &app
  <<: *hardening
  image: ghcr.io/golem953/eligibilite-livraison-express:${APP_VERSION:?APP_VERSION manquant (par exemple 0.2.0)}
  user: "1000:1000"
  environment:
    MODEL_THRESHOLD: ${MODEL_THRESHOLD:-0.5}
    MODEL_VERSION: ${MODEL_VERSION:-1.0.0}
    RANDOM_SEED: ${RANDOM_SEED:-42}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    MODEL_PATH: /data/artifacts/express_delivery_model.joblib
    MLFLOW_TRACKING_URI: /data/mlruns
    MLFLOW_ALLOW_FILE_STORE: "true"
    HOME: /tmp
  volumes:
    - app_data:/data
  depends_on:
    init-volume:
      condition: service_completed_successfully

# Réglages communs aux services d'Airflow. Le DAG `retrain_express_model` (airflow/dags/)
# réentraîne le modèle chaque nuit si assez de nouvelles commandes labellisées sont
# arrivées dans le MongoDB de l'ERP, avec l'image de prod, puis redémarre l'API si le
# modèle a changé. Exécuteur LocalExecutor : les tâches tournent dans le scheduler, sans
# Celery ni Redis ; `train` est un conteneur de l'image de l'application, lancé à travers
# `docker-proxy`. Les secrets n'ont pas de valeur par défaut : sans eux, Compose refuse
# de démarrer.
x-airflow: &airflow
  build:
    context: ./airflow
  image: livraison-express-airflow:3.3.2
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Le DAG est actif dès son chargement : déployer l'orchestrateur, c'est l'activer.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD manquant}@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?AIRFLOW_FERNET_KEY manquant}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?AIRFLOW_JWT_SECRET manquant}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?AIRFLOW_API_SECRET_KEY manquant}
    # Configuration du DAG retrain_express_model.
    RETRAIN_APP_IMAGE: ghcr.io/golem953/eligibilite-livraison-express:${APP_VERSION:?APP_VERSION manquant (par exemple 0.2.0)}
    RETRAIN_TRAINING_SOURCE_URL: ${TRAINING_SOURCE_URL:?TRAINING_SOURCE_URL manquant (MongoDB de l'ERP)}
    RETRAIN_MIN_NEW_ORDERS: ${RETRAIN_MIN_NEW_ORDERS:-100}
    RETRAIN_SCHEDULE: ${RETRAIN_SCHEDULE:-0 2 * * *}
    RETRAIN_PROMOTION_METRIC: ${PROMOTION_METRIC:-f1_score}
    RETRAIN_PROMOTION_MIN_GAIN: ${PROMOTION_MIN_GAIN:-0.0}
    RETRAIN_DOCKER_URL: tcp://docker-proxy:2375
    RETRAIN_MODEL_VOLUME: livraison-express-prod_app_data
    RETRAIN_API_CONTAINER: livraison-express-prod-api-1
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - airflow_logs:/opt/airflow/logs
  # Le MongoDB de l'ERP est joint par son adresse, comme depuis le service train.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  security_opt:
    - no-new-privileges:true
  depends_on:
    airflow-init:
      condition: service_completed_successfully

services:
  # Un volume neuf appartient à root : on le donne à appuser (UID 1000).
  init-volume:
    <<: *hardening
    image: busybox:1.36.1
    user: root
    cap_add:
      - CHOWN
    entrypoint: ["chown", "-R", "1000:1000", "/data"]
    volumes:
      - app_data:/data
    restart: "no"

  api:
    <<: *app
    ports:
      # Uniquement sur la machine : le reverse proxy expose l'API (ADR-0003, ADR-0004).
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  # Lancé à la demande, puis s'arrête (ADR-0007). Lit les commandes de l'ERP.
  train:
    <<: *app
    command: ["python", "-m", "app", "train"]
    profiles: ["train"]
    environment:
      MODEL_THRESHOLD: ${MODEL_THRESHOLD:-0.5}
      MODEL_VERSION: ${MODEL_VERSION:-1.0.0}
      RANDOM_SEED: ${RANDOM_SEED:-42}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Adresse du MongoDB de l'ERP, avec un compte en lecture seule (ADR-0010).
      TRAINING_SOURCE_URL: ${TRAINING_SOURCE_URL:?TRAINING_SOURCE_URL manquant (MongoDB de l'ERP)}
      MODEL_PATH: /data/artifacts/express_delivery_model.joblib
      MLFLOW_TRACKING_URI: /data/mlruns
      MLFLOW_ALLOW_FILE_STORE: "true"
      HOME: /tmp
    # Rend host.docker.internal disponible aussi sous Linux (Docker Desktop le fournit déjà).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  mlflow:
    <<: *hardening
    image: ghcr.io/mlflow/mlflow:v3.17.2@sha256:2cc40b3208991940d824d04f339833a0b69507569012aa5ec545690608602fc0
    user: "1000:1000"
    command: ["mlflow", "ui", "--backend-store-uri", "/data/mlruns", "--host", "0.0.0.0", "--port", "5000"]
    environment:
      MLFLOW_ALLOW_FILE_STORE: "true"
      HOME: /tmp
    volumes:
      - app_data:/data
    ports:
      # Réservé à l'équipe, par tunnel SSH (ADR-0009).
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    depends_on:
      init-volume:
        condition: service_completed_successfully
    restart: unless-stopped

  # --- Airflow (ADR-0011) ---
  airflow-postgres:
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD manquant}
    volumes:
      - airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Crée ou met à jour le schéma de la base, puis le compte administrateur.
  airflow-init:
    <<: *airflow
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        airflow db migrate &&
        (airflow users list | grep -qw admin ||
        airflow users create --username admin --password "$${AIRFLOW_ADMIN_PASSWORD}"
        --firstname Admin --lastname Airflow --email admin@example.com --role Admin)
    environment:
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD manquant}@airflow-postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?AIRFLOW_FERNET_KEY manquant}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD manquant}
    depends_on:
      airflow-postgres:
        condition: service_healthy
    restart: "no"

  airflow-apiserver:
    <<: *airflow
    command: ["api-server"]
    ports:
      # Réservé à l'équipe, par tunnel SSH (ADR-0009).
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow
    command: ["scheduler"]
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow
    command: ["dag-processor"]
    restart: unless-stopped

  # Seul accès d'Airflow à Docker. Le socket Docker donne les droits de root sur la
  # machine : le proxy n'autorise que ce dont le DAG a besoin (créer, lancer, lire et
  # supprimer un conteneur, récupérer une image, redémarrer l'API). Pas de port publié.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_RESTARTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  app_data:
  airflow_db:
  airflow_logs:
