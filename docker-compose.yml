# Environnement de développement de livraison-express-lite (ADR-0004).
#
#   docker compose --env-file .env.dev up -d --build    API + interface MLflow
#   docker compose --env-file .env.dev run --rm train   entraîne le modèle
#   docker compose --env-file .env.dev restart api      sert le nouveau modèle
#
# Chaque environnement a son compose et son fichier de variables (voir CONTRIBUTING.md) :
#   dev   sur son poste, branches feat/* et dev   -> docker-compose.yml       + .env.dev
#   test  branche release/<version>               -> docker-compose.test.yml  + .env.test
#   prod  branche main                            -> docker-compose.prod.yml  + .env.prod
#
# Une clé absente ou vide prend la valeur par défaut indiquée après « :- ».

name: livraison-express

# Durcissement appliqué à tous les services : système de fichiers en lecture seule
# (seuls le volume et /tmp sont modifiables), aucune capacité Linux, aucune
# élévation de privilèges possible (sudo, setuid).
x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

# Réglages communs aux services qui exécutent l'application.
x-app: &app
  <<: *hardening
  build:
    context: .
    target: ${APP_ENV:-dev}
  image: livraison-express:${APP_ENV:-dev}
  # Même utilisateur que appuser, y compris avec l'image dev (qui n'en définit pas) :
  # sans capacités, root ne pourrait pas écrire dans le volume qui appartient à l'UID 1000.
  user: "1000:1000"
  environment:
    MODEL_THRESHOLD: ${MODEL_THRESHOLD:-0.5}
    MODEL_VERSION: ${MODEL_VERSION:-1.0.0}
    RANDOM_SEED: ${RANDOM_SEED:-42}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    TRAINING_SOURCE_URL: ${TRAINING_SOURCE_URL:-memory://}
    # Modèle et runs MLflow sur le volume partagé, pour qu'ils survivent aux conteneurs.
    MODEL_PATH: /data/artifacts/express_delivery_model.joblib
    MLFLOW_TRACKING_URI: /data/mlruns
    MLFLOW_ALLOW_FILE_STORE: "true"
    # appuser n'a pas de dossier personnel : les fichiers temporaires vont dans /tmp.
    HOME: /tmp
  volumes:
    - app_data:/data
  depends_on:
    init-volume:
      condition: service_completed_successfully

services:
  # Un volume neuf appartient à root : on le donne à appuser (UID 1000) avant
  # que l'API et l'entraînement, qui tournent sans les droits root, ne s'en servent.
  init-volume:
    <<: *hardening
    image: busybox:1.36.1
    user: root
    # Seule capacité nécessaire : changer le propriétaire des fichiers.
    cap_add:
      - CHOWN
    entrypoint: ["chown", "-R", "1000:1000", "/data"]
    volumes:
      - app_data:/data
    restart: "no"

  api:
    <<: *app
    ports:
      # Uniquement sur la machine, pas sur le réseau (ADR-0005).
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  # Lancé à la demande, puis s'arrête (ADR-0003) : docker compose run --rm train
  train:
    <<: *app
    command: ["python", "-m", "app", "train"]
    profiles: ["train"]
    restart: "no"

  # Interface web de MLflow sur les runs de l'entraînement.
  # Image officielle : l'image de l'application ne contient que mlflow-skinny, sans serveur.
  # Le volume reste en écriture : au démarrage, MLflow crée /data/mlruns/models.
  mlflow:
    <<: *hardening
    image: ghcr.io/mlflow/mlflow:v3.17.2@sha256:2cc40b3208991940d824d04f339833a0b69507569012aa5ec545690608602fc0
    # L'image officielle tourne en root par défaut.
    user: "1000:1000"
    command:
      - mlflow
      - ui
      - --backend-store-uri
      - /data/mlruns
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    environment:
      MLFLOW_ALLOW_FILE_STORE: "true"
      HOME: /tmp
    volumes:
      - app_data:/data
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    depends_on:
      init-volume:
        condition: service_completed_successfully
    restart: unless-stopped

  # --- Dev uniquement : un MongoDB et un ETL simulés à la place de ceux de l'ERP (ADR-0009) ---
  #   docker compose --env-file .env.dev --profile etl up -d --build
  #   TRAINING_SOURCE_URL=mongodb://mongodb:27017/livraison_express dans .env.dev, puis train.
  # En prod, ces deux services n'existent pas : l'entraînement lit le MongoDB de l'ERP.
  mongodb:
    <<: *hardening
    image: mongo:8.3.13@sha256:e16e606f792ea89d2b4907b54e5e31eb86a7a23e27231dce3a982cc8f2d73cd2
    # Utilisateur mongodb de l'image : propriétaire des dossiers de données d'un volume neuf.
    user: "999:999"
    profiles: ["etl"]
    volumes:
      - mongo_dev_data:/data/db
      - mongo_dev_config:/data/configdb
    ports:
      # 27018 : le port 27017 reste libre pour le MongoDB de l'ERP simulé.
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  etl-simulator:
    <<: *hardening
    build:
      context: ./etl_simulator
    image: livraison-express-etl-simulator:dev
    profiles: ["etl"]
    environment:
      MONGO_URI: mongodb://mongodb:27017/livraison_express
      HISTORY_ORDERS: ${ETL_HISTORY_ORDERS:-3000}
      BATCH_SIZE: ${ETL_BATCH_SIZE:-5}
      INTERVAL_SECONDS: ${ETL_INTERVAL_SECONDS:-5}
      LIVE_ORDER_LIMIT: ${ETL_LIVE_ORDER_LIMIT:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"

volumes:
  app_data:
  mongo_dev_data:
  mongo_dev_config:
