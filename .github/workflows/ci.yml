# Intégration continue : lint, tests et build de l'image Docker.
#
# Se lance sur toutes les branches entre dev et main (Git Flow) :
#   - à chaque push sur dev, release/* et hotfix/* ;
#   - à chaque pull request vers dev ou vers main.
# Elle sert aussi d'étape de vérification à la CD (cd.yml), qui l'appelle avant
# de publier une image.
name: CI

on:
  push:
    branches: [dev, "release/**", "hotfix/**"]
  pull_request:
    branches: [dev, main]
  workflow_call:

permissions:
  contents: read

# Un nouveau push annule l'exécution en cours sur la même branche.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Même version de Ruff que sur les postes de dev, lue dans requirements-dev.txt.
      - name: Installer Ruff
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"

      - name: Ruff
        run: ruff check --output-format=github .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: pytest -v

  docker:
    name: Docker Compose (test)
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      # IMAGE_TAG factice : docker-compose.prod.yml l'exige, mais rien n'est téléchargé ici.
      - name: Valider les fichiers Compose
        env:
          IMAGE_TAG: ci
        run: |
          for env in dev test prod; do
            docker compose -f docker-compose.$env.yml config --quiet
          done

      # L'image test est identique à prod : on la construit et on la fait tourner
      # comme sur un environnement de validation. Les .env.* n'étant pas dans git,
      # Compose prend les valeurs par défaut des fichiers.
      - name: Construire l'image test
        run: docker compose -f docker-compose.test.yml build api

      - name: Entraîner le modèle
        run: docker compose -f docker-compose.test.yml run --rm train

      - name: Démarrer l'API et vérifier qu'elle sert le modèle
        run: |
          docker compose -f docker-compose.test.yml up -d --wait api
          curl -fsS http://127.0.0.1:8000/health/ready

      - name: Logs en cas d'échec
        if: failure()
        run: docker compose -f docker-compose.test.yml logs

      - name: Arrêter l'environnement
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
