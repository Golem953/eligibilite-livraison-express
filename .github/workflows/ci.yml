# Intégration continue : lint, tests et build de l'image Docker.
#
# Se lance sur toutes les branches entre dev et main (Git Flow) :
#   - à chaque push sur dev, release/* et hotfix/* ;
#   - à chaque pull request vers dev ou vers main.
# L'image n'est construite que sur release/* et hotfix/* : avant, lint et tests seulement.
# Elle sert aussi d'étape de vérification à la CD (cd.yml), qui l'appelle avant
# de publier une image.
name: CI

on:
  push:
    branches: [dev, "release/**", "hotfix/**"]
  pull_request:
    branches: [dev, main]
  workflow_call:
  # Lancée par le bouton Release et la CD sur les branches qu'ils créent : une branche
  # créée avec le GITHUB_TOKEN ne déclenche pas le push ci-dessus.
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push annule l'exécution en cours sur la même branche.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Même version de Ruff que sur les postes de dev, lue dans requirements-dev.txt.
      - name: Installer Ruff
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"

      - name: Ruff
        run: ruff check --output-format=github .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-24.04
    # MongoDB jetable : les tests de contrat du repository et du labelliseur tournent
    # aussi sur une vraie base (ADR-0009). Série 7.0 et non 8.x comme les composes :
    # MongoDB 8.x refuse de démarrer sur le noyau Linux des runners (6.19 et plus,
    # SERVER-121912). Les tests n'utilisent que des opérations identiques en 7.0.
    services:
      mongodb:
        image: mongo:7.0.48@sha256:41e8195b2791692695e1dc9bd21cd51d0a3af05fff8ace9304a5c1acf94f1ae1
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_MONGO_URL: mongodb://localhost:27017/livraison_express_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: pytest -v

  dag:
    name: DAG Airflow (chargement)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # L'image Airflow de la prod : le DAG est chargé avec les mêmes versions qu'en prod.
      - name: Construire l'image Airflow
        run: docker build -t livraison-express-airflow:ci airflow

      - name: Charger le DAG
        run: >-
          docker run --rm -v "$PWD/airflow:/opt/airflow/check:ro" livraison-express-airflow:ci
          python /opt/airflow/check/check_dag.py

  docker:
    name: Build de l'image prod
    runs-on: ubuntu-24.04
    needs: [lint, test, dag]
    # Aucune image avant la release : seulement sur release/* et hotfix/* (push ou PR vers
    # main). Sur dev, les feat/* et dans la CD (qui construit elle-même), ce job est sauté.
    if: >-
      startsWith(github.ref_name, 'release/') || startsWith(github.ref_name, 'hotfix/') ||
      startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/')
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Vérifie seulement que l'image se construit : rien n'est publié ici.
      - name: Construire l'image prod
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
