# Livraison continue : publie l'image de production sur GitHub Container Registry.
#
# Se lance quand une branche release/<version> ou hotfix/<version> est fusionnée
# dans main (Git Flow). Elle ne déploie rien : elle construit l'image, la publie
# sous ghcr.io/<propriétaire>/<dépôt>, puis pose le tag Git v<version>.
#
# La version vient de pyproject.toml : elle doit être augmentée dans la branche
# release/hotfix avant la fusion, sinon la CD s'arrête (le tag existerait déjà).
name: CD

on:
  push:
    branches: [main]

# Deux publications ne doivent jamais tourner en même temps.
concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publier l'image
    runs-on: ubuntu-24.04
    needs: ci
    permissions:
      contents: write   # poser le tag Git
      packages: write   # publier sur ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Lire la version
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$version' invalide dans pyproject.toml (attendu : MAJEUR.MINEUR.CORRECTIF)."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::Le tag v$version existe déjà : augmentez la version dans pyproject.toml (branche release ou hotfix)."
            exit 1
          fi
          {
            echo "version=$version"
            echo "minor=${version%.*}"
            # ghcr.io impose un nom d'image en minuscules.
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"

      - name: Étiquettes de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image prod
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Poser le tag Git v${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Version ${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
