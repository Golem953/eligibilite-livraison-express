# Livraison continue : publie l'image de production sur GitHub Container Registry.
#
# Se lance au merge d'une PR release/x.y.z ou hotfix/x.y.z dans main. Elle ne
# déploie rien : elle construit l'image, la publie sous ghcr.io/<propriétaire>/<dépôt>,
# pose le tag Git vx.y.z, crée la release GitHub et supprime la branche mergée.
# Après un hotfix, elle ouvre en plus la PR de report fix/report-hotfix-x.y.z vers dev.
#
# La version vient du nom de la branche de la PR mergée, jamais d'un fichier.
# Un commit de main qui ne vient pas d'une PR release/ ou hotfix/ est refusé, et une
# version déjà taguée ne se republie jamais.
name: CD

on:
  push:
    branches: [main]

# Deux publications ne doivent jamais tourner en même temps.
concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  version:
    name: Lire la version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      branche: ${{ steps.version.outputs.branche }}
    steps:
      - name: Version depuis la branche de la PR mergée
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branche=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].head.ref // ""')
          if ! [[ "$branche" =~ ^(release|hotfix)/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Ce commit de main ne vient pas d'une PR release/x.y.z ou hotfix/x.y.z (branche : « $branche ») : rien n'est publié."
            exit 1
          fi
          version=${BASH_REMATCH[2]}
          if gh api "repos/$GH_REPO/git/ref/tags/v$version" > /dev/null 2>&1; then
            echo "::error::Le tag v$version existe déjà : une version publiée ne se republie jamais."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branche=$branche" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publier l'image
    runs-on: ubuntu-24.04
    needs: [version, ci]
    permissions:
      contents: write   # tag Git, release GitHub, suppression de la branche
      packages: write   # publier sur ghcr.io
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BRANCHE: ${{ needs.version.outputs.branche }}
    steps:
      - uses: actions/checkout@v4

      - name: Nom de l'image
        id: image
        # ghcr.io impose un nom d'image en minuscules.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Étiquettes de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image prod
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag v${{ env.VERSION }} et release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Version $VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes

      - name: Supprimer ${{ env.BRANCHE }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCHE" || echo "Branche déjà supprimée."

  report-hotfix:
    name: Report du hotfix dans dev
    runs-on: ubuntu-24.04
    needs: [version, publish]
    if: startsWith(needs.version.outputs.branche, 'hotfix/')
    permissions:
      contents: read
    steps:
      # RELEASE_TOKEN, pas GITHUB_TOKEN : sinon la CI ne se lancerait pas sur la PR de report.
      - name: Ouvrir la PR fix/report-hotfix-x.y.z vers dev
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret RELEASE_TOKEN absent : créez fix/report-hotfix-$VERSION depuis le tag v$VERSION et ouvrez la PR vers dev à la main."
            exit 1
          fi
          branche="fix/report-hotfix-$VERSION"
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/heads/$branche" -f sha="$GITHUB_SHA" > /dev/null
          gh pr create --base dev --head "$branche" --title "Report du hotfix $VERSION dans dev" --body "$(printf '%s\n\n%s' \
            "Report du hotfix \`$VERSION\` (tag \`v$VERSION\`), seule entrée de main dans dev." \
            "À merger avec **Create a merge commit**, jamais en squash ni en rebase. En cas de conflit : \`git switch $branche\`, \`git merge origin/dev\`, résoudre, commit, push.")"
